<div class="favourite-notification">
  <button class="close-btn" (click)="onClose()">
    <mat-icon>close</mat-icon>
  </button>
  <h4 class="favourite-notification-title">Added to your favourites</h4>
  <p class="favourite-notification-item">{{ productName() }}</p>
  <button class="view-favourites-btn" (click)="onViewFavourites()">View Favourites</button>
</div>
