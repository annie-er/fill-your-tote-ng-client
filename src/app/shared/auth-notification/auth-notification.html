<div class="auth-notification">
  <button class="close-btn" (click)="onClose()">
    <mat-icon>close</mat-icon>
  </button>
  <h4 class="auth-notification-title">Sign in required</h4>
  <p class="auth-notification-item">You must be signed in to add to favourites.</p>
  <button class="view-auth-btn" (click)="onViewAuth()">Sign in</button>
</div>
