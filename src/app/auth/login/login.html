<div class="auth-page">
  <div class="auth-card">

    <h1 class="auth-title">Welcome back!</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          [class.field-error]="email.invalid && email.touched"
          autocomplete="email"
        />
        @if (email.invalid && email.touched) {
          <span class="error-text">Please enter a valid email</span>
        }
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            [class.field-error]="password.invalid && password.touched"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword" tabindex="-1">
            @if (showPassword) {
              <mat-icon>visibility</mat-icon>
            } 
            @else {
              <mat-icon>visibility_off</mat-icon>
            }
          </button>
        </div>
        @if (password.invalid && password.touched) {
          <span class="error-text">Password is required</span>
        }
      </div>

      @if (errorMessage()) {
        <div class="error-banner">
          <mat-icon class="error-icon">error</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button type="submit" class="submit-btn" [disabled]="isLoading()">
        {{ isLoading() ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/register">Create an account</a>
    </p>

  </div>
</div>
